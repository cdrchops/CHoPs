        .highlight-green { box-shadow: inset 0 0 3px 3px rgba(40, 167, 69, 0.8) !important; background-color: rgba(40, 167, 69, 0.2) !important; }
        .highlight-red { box-shadow: inset 0 0 3px 3px rgba(220, 53, 69, 0.8) !important; background-color: rgba(220, 53, 69, 0.2) !important; }
        .highlight-orange { box-shadow: inset 0 0 3px 3px rgba(253, 126, 20, 0.8) !important; background-color: rgba(253, 126, 20, 0.2) !important; }
        .highlight-yellow { box-shadow: inset 0 0 3px 3px rgba(255, 193, 7, 0.8) !important; background-color: rgba(255, 193, 7, 0.2) !important; }
        .highlight-purple { box-shadow: inset 0 0 3px 3px rgba(111, 66, 193, 0.8) !important; background-color: rgba(111, 66, 193, 0.2) !important; }
        .highlight-blue { box-shadow: inset 0 0 3px 3px rgba(0, 123, 255, 0.8) !important; background-color: rgba(0, 123, 255, 0.2) !important; }
        .highlight-tan { box-shadow: inset 0 0 3px 3px rgba(210, 180, 140, 0.8) !important; background-color: rgba(210, 180, 140, 0.2) !important; }

        .square-multi-highlight {
            position: relative;
        }

        /* Slide-out options drawer */
        #options-drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background: #ffffff;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 1050;
            padding: 20px;
            overflow-y: auto;
        }
        #options-drawer.open {
            right: 0;
        }
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1040;
        }
        .drawer-overlay.open {
            display: block;
        }
    </style>

    <script src="js/updateVisualizations.js"></script>
    <script type="text/javascript" language="javascript">
        const getObjectMethods = (obj) => {
            let properties = new Set();
            let currentObj = obj;
            do {
                Object.getOwnPropertyNames(currentObj).map(item => properties.add(item));
            } while ((currentObj = Object.getPrototypeOf(currentObj)));

            return [...properties.keys()].filter(item => typeof obj[item] === 'function');
        };

        // Example usage:
        // const chess = new Chess();
        // console.log(getObjectMethods(chess));

        var wait_for_script;
        var newGame = function (){};
        var activeGameInstance = null;

        function toggleAnalysisMode() {
            if (activeGameInstance && typeof activeGameInstance.toggleAnalysis === 'function') {
                activeGameInstance.toggleAnalysis();
            }
        }

        function undoAnalysisMove() {
            if (activeGameInstance && typeof activeGameInstance.undoAnalysis === 'function') {
                activeGameInstance.undoAnalysis();
            }
        }

        function resetAnalysisToCurrent() {
            if (activeGameInstance && typeof activeGameInstance.resetAnalysis === 'function') {
                activeGameInstance.resetAnalysis();
            }
        }

        function exitAnalysisMode() {
            if (activeGameInstance && typeof activeGameInstance.exitAnalysis === 'function') {
                activeGameInstance.exitAnalysis();
            }
        }

        /// We can load Stockfish.js via Web Workers or directly via a <script> tag.
        /// Web Workers are better since they don't block the UI, but they are not always avaiable.
        (function fix_workers()
        {
            if (typeof STOCKFISH !== "undefined") return;
            /// Does the environment support web workers?  If not, include stockfish.js directly.
            if (!Worker || (location && location.protocol === "file:")) {
                var script_tag  = document.createElement("script");
                script_tag.type ="text/javascript";
                script_tag.src  = "js/stockfish.asm.js";
                document.getElementsByTagName("head")[0].appendChild(script_tag);
            }
        }());

        function getRandomOpening(max) {
            return Math.floor(Math.random() * Math.floor(max));
        }

        function loadRandomOpening() {
            var items = [];
            var randomOpening = {};
            var fen = "";

            $.each( eco, function( key, val ) {
                items.push( "<li id='" + key + "'>" + JSON.stringify(val) + "</li>" );
            });

            count = items.length;
            randomOpening = eco[getRandomOpening(count)];
            $('#chops').empty();
            $("#chops").append(JSON.stringify(randomOpening));
            fen = randomOpening.moves;
            loadPGN(fen);

            console.log("fen is " + fen);
        }

        function loadNewGame(pgn) {
            console.log("pgn is from fen which is " + pgn);
            var options = {};
            if (pgn !== '' && pgn !== undefined) {
                options = {pgn:pgn};
            }
            var game = engineGame(options);
            activeGameInstance = game;

            newGame = function newGame() {
                var baseTime = parseFloat($('#timeBase').val()) * 60;
                var inc = parseFloat($('#timeInc').val());
                var skill = parseInt($('#skillLevel').val());
                game.setTime(baseTime, inc);
                game.setSkillLevel(skill);
                game.setPlayerColor($('#color-white').hasClass('active') ? 'white' : 'black');
                game.setDisplayScore($('#showScore').is(':checked'));
                game.start();
                updateVisualizations(game);
            };

            document.getElementById("skillLevel").addEventListener("change", function() {
                game.setSkillLevel(parseInt(this.value, 10));
            });

            newGame();
        }

        function loadPGN(pgn) {
            loadNewGame(pgn);
        }

        // Drawer and visualization handlers
        $(document).ready(function() {
            $('#toggle-drawer-btn, #close-drawer-btn, #drawer-overlay').click(function() {
                $('#options-drawer').toggleClass('open');
                $('#drawer-overlay').toggleClass('open');
            });

            $('.rule-toggle, input[name="visualization-side"]').change(function() {
                updateVisualizations(activeGameInstance);
            });

            $('#visualization-side-group .btn').click(function() {
                setTimeout(function() {
                    updateVisualizations(activeGameInstance);
                }, 0);
            });

            // Initialize board as a new game on page load
            loadNewGame('');
        });

    </script>
